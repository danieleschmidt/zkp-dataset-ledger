[package]
name = "zkp-dataset-ledger"
version = "0.2.0"
edition = "2021"
authors = ["Daniel Schmidt <danschmidt88@gmail.com>"]
description = "Zero-knowledge proof ledger for ML dataset provenance — prove training data properties without revealing the data"
repository = "https://github.com/danieleschmidt/zkp-dataset-ledger"
license = "Apache-2.0"
keywords = ["zero-knowledge", "cryptography", "ml", "provenance", "dataset"]
categories = ["cryptography", "science"]
readme = "README.md"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Cryptographic hash functions
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"

# Random number generation (for nonce generation)
rand = "0.8"

# Error handling
thiserror = "1.0"

# Time (for timestamps)
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "zkp-ledger"
path = "src/bin/zkp-ledger.rs"
